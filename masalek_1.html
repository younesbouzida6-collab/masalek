<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>مسالك · Masalek</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#060806;
  --surface:#0d1210;
  --surface-2:#141c17;
  --line:#1e2b23;
  --line-soft:#16201a;
  --green:#35f09a;
  --green-dim:#1d8a5b;
  --green-deep:#07361f;
  --sand:#c9c4b4;
  --warn:#e0a45c;
  --muted:#6e7a73;
  --sans:"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sheet-peek:184px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--ink);color:var(--sand);
  font-family:var(--sans);font-weight:400;overflow:hidden
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font-family:inherit}

/* ---------- map ---------- */
#map{position:fixed;inset:0;background:var(--ink);z-index:0}
.leaflet-container{background:#070a08;font-family:var(--sans)}
/* tiles arrive light — invert and cool them into the theme */
.leaflet-tile{
  filter:invert(1) hue-rotate(180deg) brightness(.66) contrast(1.12) saturate(.28)
}
/* Esri fallback is already dark, so no inversion there */
body.darkbase .leaflet-tile{filter:brightness(.84) saturate(.5) hue-rotate(-10deg)}
.leaflet-tile-pane::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,rgba(6,20,13,.18),rgba(4,8,6,.5));
  mix-blend-mode:multiply
}
.leaflet-control-attribution{
  background:rgba(6,8,6,.72)!important;color:var(--muted)!important;
  font-family:var(--mono);font-size:9px!important
}
.leaflet-control-attribution a{color:var(--green-dim)!important}
.leaflet-control-zoom{display:none}

.pin{position:relative;width:26px;height:26px}
.pin i{position:absolute;inset:7px;border-radius:50%;display:block;
  background:var(--green);box-shadow:0 0 0 2px var(--ink),0 0 14px rgba(53,240,154,.55)}
.pin b{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(53,240,154,.35)}
.pin.dim i{background:transparent;border:1.5px solid var(--green-dim);
  box-shadow:0 0 0 2px rgba(6,8,6,.85)}
.pin.dim b{display:none}
.card.wiki .card-body h3{color:#cdd6d1;font-weight:500}
.wikipill{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:2px 5px;margin-inline-start:6px;
  vertical-align:middle;text-transform:uppercase}
.zoomhint{padding:26px 20px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
.pin.is-active i{background:#fff;box-shadow:0 0 0 2px var(--ink),0 0 20px rgba(255,255,255,.6)}

.me{position:relative;width:34px;height:34px}
.me i{position:absolute;inset:12px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 3px var(--ink);display:block}
.me b{position:absolute;inset:0;border-radius:50%;background:rgba(53,240,154,.16);
  animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}

/* ---------- HUD ---------- */
.hud{
  position:fixed;top:0;left:0;right:0;z-index:600;
  padding:calc(10px + env(safe-area-inset-top)) 14px 12px;
  background:linear-gradient(180deg,rgba(6,8,6,.94) 12%,rgba(6,8,6,.72) 62%,transparent);
  pointer-events:none;display:flex;align-items:flex-start;justify-content:space-between;gap:12px
}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em;color:#eef3ef}
.brand span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  color:var(--green-dim);text-transform:uppercase}

.hud-end{display:flex;flex-direction:column;align-items:flex-end;gap:7px;pointer-events:auto}
[dir=ltr] .hud-end{align-items:flex-end}
.signal{font-family:var(--mono);font-size:10px;line-height:1.65;
  color:var(--muted);direction:ltr;white-space:nowrap;text-align:right}
.signal .lock{color:var(--green)}
.signal .lock.off{color:var(--muted)}

.langs{display:flex;align-items:center;direction:ltr;
  border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:rgba(9,13,11,.8);backdrop-filter:blur(8px)}
.langs button{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
  padding:5px 8px;color:var(--muted);transition:color .16s ease,background .16s ease
}
.langs button + button{border-left:1px solid var(--line)}
.langs button.on{color:var(--green);background:rgba(53,240,154,.09)}

/* ---------- controls ---------- */
.locate{
  position:fixed;z-index:610;inset-inline-end:14px;
  bottom:calc(var(--sheet-peek) + 18px + env(safe-area-inset-bottom));
  width:46px;height:46px;border-radius:15px;
  background:rgba(13,18,16,.9);border:1px solid var(--line);backdrop-filter:blur(10px);
  display:grid;place-items:center;transition:transform .18s ease,border-color .18s ease
}
.locate:active{transform:scale(.93)}
.locate.on{border-color:var(--green-dim)}
.locate svg{width:19px;height:19px;stroke:var(--green);fill:none;stroke-width:1.6}

/* ---------- sheet ---------- */
.sheet{
  position:fixed;z-index:620;left:0;right:0;bottom:0;
  height:82vh;max-height:640px;
  background:linear-gradient(180deg,var(--surface) 0%,#090d0b 100%);
  border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  transform:translateY(calc(100% - var(--sheet-peek)));
  transition:transform .34s cubic-bezier(.22,.9,.3,1);
  display:flex;flex-direction:column;box-shadow:0 -18px 50px rgba(0,0,0,.6)
}
.sheet.open{transform:translateY(0)}
.sheet.dragging{transition:none}
.grip{padding:10px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none;flex:none}
.grip span{width:38px;height:3px;border-radius:2px;background:var(--line);display:block}

.sheet-head{flex:none;padding:4px 18px 12px;display:flex;align-items:baseline;
  justify-content:space-between;gap:10px;border-bottom:1px solid var(--line-soft)}
.sheet-head h2{margin:0;font-size:14px;font-weight:600;color:#e6ece8;letter-spacing:-.01em;flex:1}
.sheet-head em{font-style:normal;font-family:var(--mono);font-size:10px;
  color:var(--muted);letter-spacing:.06em}
.toggle{flex:none;width:28px;height:28px;border-radius:9px;background:var(--surface-2);
  display:grid;place-items:center;transition:background .16s ease}
.toggle:active{background:var(--line)}
.toggle svg{width:13px;height:13px;stroke:var(--muted);stroke-width:2.2;fill:none;
  transition:transform .3s cubic-bezier(.22,.9,.3,1)}
.sheet.collapsed .toggle svg{transform:rotate(180deg)}

.search{flex:none;display:flex;align-items:center;gap:9px;padding:8px 16px;
  border-bottom:1px solid var(--line-soft)}
.search > svg{flex:none;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;
  color:var(--sand);font-size:13.5px;padding:7px 0}
.search input::placeholder{color:#4b544e}
.search .clear{flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface-2);
  display:none;place-items:center}
.search .clear.on{display:grid}
.search .clear svg{width:9px;height:9px;stroke:var(--muted);stroke-width:2.6;fill:none}

.list{flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:6px 12px calc(96px + env(safe-area-inset-bottom))}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.9}
.empty strong{display:block;color:var(--sand);font-weight:500;font-size:14px;margin-bottom:6px}

.card{width:100%;display:flex;gap:12px;text-align:start;padding:12px 8px;
  border-bottom:1px solid var(--line-soft);transition:background .15s ease}
.card:active{background:var(--surface-2)}
.card:last-child{border-bottom:0}
.thumb{flex:none;width:88px;height:88px;border-radius:16px;overflow:hidden;
  background:var(--green-deep);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:100%;height:100%;display:block}
.card-body{flex:1;min-width:0;padding-top:2px}
.card-body h3{margin:0 0 3px;font-size:14.5px;font-weight:600;color:#e9efeb;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.card-body p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding-top:6px;min-width:46px}
.meta .dist{font-family:var(--mono);font-size:10.5px;color:var(--green);letter-spacing:.02em}
.bearing{width:16px;height:16px;stroke:var(--green-dim);fill:none;stroke-width:1.7;
  transition:transform .5s ease}

/* ---------- add ---------- */
.add{
  position:fixed;z-index:640;bottom:calc(20px + env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);
  padding:13px 22px;border-radius:999px;background:var(--green);color:#04140c;
  font-size:13.5px;font-weight:700;letter-spacing:-.01em;
  box-shadow:0 8px 26px rgba(53,240,154,.28);
  display:flex;align-items:center;gap:7px;transition:transform .18s ease,opacity .18s ease
}
.add:active{transform:translateX(-50%) scale(.95)}
.add.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(14px)}
.add svg{width:15px;height:15px;stroke:#04140c;stroke-width:2.4;fill:none}

/* ---------- pick mode ---------- */
.crosshair{position:fixed;z-index:615;top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;width:70px;height:70px;display:none;place-items:center}
.crosshair.on{display:grid}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:var(--green);opacity:.85}
.crosshair::before{width:1px;height:70px}
.crosshair::after{width:70px;height:1px}
.crosshair i{width:26px;height:26px;border:1.5px solid var(--green);border-radius:50%;
  background:rgba(53,240,154,.1);position:relative;z-index:2}
.pickbar{position:fixed;z-index:650;left:14px;right:14px;
  bottom:calc(20px + env(safe-area-inset-bottom));
  background:rgba(13,18,16,.95);border:1px solid var(--line);backdrop-filter:blur(14px);
  border-radius:18px;padding:14px 16px;display:none;align-items:center;gap:12px}
.pickbar.on{display:flex}
.pickbar p{margin:0;flex:1;font-size:12.5px;line-height:1.6;color:var(--muted)}
.pickbar p b{display:block;color:var(--sand);font-weight:500;font-size:13.5px;margin-bottom:2px}
.pickbar button{padding:12px 20px;border-radius:13px;background:var(--green);
  color:#04140c;font-size:13px;font-weight:700;white-space:nowrap}

/* ---------- modals ---------- */
.scrim{position:fixed;inset:0;z-index:700;background:rgba(3,5,4,.72);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .26s ease}
.scrim.on{opacity:1;pointer-events:auto}

.panel{position:fixed;z-index:710;left:0;right:0;bottom:0;max-height:92vh;
  display:flex;flex-direction:column;background:var(--surface);
  border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  transform:translateY(101%);transition:transform .34s cubic-bezier(.22,.9,.3,1)}
.panel.on{transform:translateY(0)}
.panel-head{flex:none;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:18px 18px 12px;border-bottom:1px solid var(--line-soft)}
.panel-head h2{margin:0;font-size:17px;font-weight:600;color:#eef3ef;letter-spacing:-.015em}
.close{flex:none;width:32px;height:32px;border-radius:10px;background:var(--surface-2);
  display:grid;place-items:center}
.close svg{width:14px;height:14px;stroke:var(--muted);stroke-width:2;fill:none}
.panel-body{flex:1;overflow-y:auto;padding:16px 18px calc(24px + env(safe-area-inset-bottom))}

.gallery{display:flex;gap:9px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px}
.gallery{scroll-snap-type:x mandatory}
.gallery img,.gallery .ph{flex:none;width:270px;height:194px;border-radius:16px;
  object-fit:cover;background:var(--green-deep);scroll-snap-align:start;cursor:zoom-in}
.gallery img{transition:opacity .2s ease}
.gallery img:active{opacity:.85}

.lightbox{position:fixed;inset:0;z-index:950;background:rgba(3,5,4,.95);
  display:none;place-items:center;padding:20px;cursor:zoom-out}
.lightbox.on{display:grid}
.lightbox img{max-width:94vw;max-height:88vh;border-radius:14px;object-fit:contain}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);
  width:54px;height:54px;border-radius:50%;cursor:pointer;
  background:rgba(13,18,16,.88);border:1px solid var(--line);
  backdrop-filter:blur(8px);display:grid;place-items:center;
  transition:background .16s ease,border-color .16s ease}
.lb-nav:hover{border-color:var(--green-dim);background:rgba(20,28,23,.95)}
.lb-nav svg{width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:2.2}
.lb-nav.prev{left:18px}
.lb-nav.next{right:18px}
.lb-nav.off{display:none}
@media(max-width:600px){
  .lb-nav{width:44px;height:44px}
  .lb-nav.prev{left:8px}
  .lb-nav.next{right:8px}
}

.lightbox .count{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:11px;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);padding:6px 14px;border-radius:999px}
.tagline{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--green-dim);margin:0 0 14px}
.story{font-size:14.5px;line-height:2.05;color:var(--sand);margin:0 0 16px;white-space:pre-wrap}
.origin{display:flex;align-items:center;gap:8px;margin:0 0 20px;padding:10px 13px;
  border:1px solid var(--line);border-radius:12px;
  font-size:11.5px;line-height:1.6;color:var(--muted)}
.origin::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--green-dim)}
.origin.hide{display:none}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);
  border-radius:14px;overflow:hidden}
.facts div{background:var(--surface-2);padding:12px 14px}
.facts dt{font-size:10px;color:var(--muted);margin:0 0 4px;letter-spacing:.04em}
.facts dd{margin:0;font-family:var(--mono);font-size:12.5px;color:var(--green);text-align:start}
.facts dd.txt{font-family:var(--sans);color:var(--sand);font-size:13px}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.field input,.field textarea{width:100%;background:#080c0a;border:1px solid var(--line);
  border-radius:13px;padding:12px 14px;color:var(--sand);font-size:14px;
  outline:none;transition:border-color .18s ease}
.field textarea{min-height:132px;resize:vertical;line-height:1.85}
.field input:focus,.field textarea:focus{border-color:var(--green-dim)}
.field input::placeholder,.field textarea::placeholder{color:#4b544e}
.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.drop{border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;
  color:var(--muted);font-size:12.5px;line-height:1.7;transition:border-color .18s ease}
.drop:active{border-color:var(--green-dim)}
.drop b{display:block;color:var(--sand);font-weight:500;font-size:13.5px;margin-bottom:3px}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.shot{position:relative;width:74px;height:74px;border-radius:12px;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button{position:absolute;top:4px;inset-inline-end:4px;width:20px;height:20px;
  border-radius:50%;background:rgba(3,5,4,.82);display:grid;place-items:center}
.shot button svg{width:9px;height:9px;stroke:#fff;stroke-width:2.6;fill:none}

.locpick{display:flex;align-items:center;gap:11px;background:var(--surface-2);
  border-radius:14px;padding:13px 15px}
.locpick .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--green)}
.locpick p{margin:0;flex:1;font-size:12.5px;color:var(--muted)}
.locpick p b{display:block;font-family:var(--mono);font-size:11.5px;color:var(--sand);
  margin-top:3px;text-align:start}
.locpick button{font-size:12px;color:var(--green);font-weight:600;white-space:nowrap}

.misshint{display:none;font-size:11.5px;line-height:1.7;color:var(--warn);
  margin:0 0 11px;text-align:center}
.misshint.on{display:block}
.misshint b{color:var(--sand);font-weight:600}
.misshint button{display:inline-block;margin-top:8px;padding:7px 14px;border-radius:999px;
  border:1px solid var(--warn);color:var(--warn);font-size:11.5px;font-weight:600}
.locpick.needed{border:1px solid var(--warn)}
.locpick.needed .dot{background:var(--warn)}

.submit{width:100%;padding:15px;border-radius:15px;background:var(--green);color:#04140c;
  font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin-top:6px;transition:opacity .18s ease}
.submit:disabled{opacity:.35}
.hint{font-size:11.5px;color:var(--muted);text-align:center;margin:12px 0 0;line-height:1.7}

.toast{position:fixed;z-index:900;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--surface-2);border:1px solid var(--line);padding:11px 18px;
  border-radius:999px;font-size:12.5px;color:var(--sand);
  transition:opacity .24s ease,transform .24s ease;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(min-width:860px){
  .sheet{right:auto;left:16px;top:16px;bottom:16px;width:392px;height:auto;max-height:none;
    border-radius:20px;border:1px solid var(--line);transform:none}
  [dir=rtl] .sheet{left:auto;right:16px}
  .sheet.collapsed{display:none}
  .listbtn.on{display:grid}
  .grip{display:none}
  .sheet-head{padding-top:18px}
  .locate{inset-inline-end:16px;bottom:auto;top:110px}
  .adminbtn{inset-inline-end:16px;bottom:auto;top:166px}
  .add{left:auto;inset-inline-end:16px;bottom:22px;transform:none}
  .add:active{transform:scale(.95)}
  .add.hide{transform:translateY(14px)}
  .panel{left:auto;inset-inline-end:16px;bottom:16px;top:16px;width:452px;
    max-height:none;border-radius:20px;border:1px solid var(--line);
    transform:translateY(calc(100% + 32px))}
  .panel.on{transform:translateY(0)}
  .pickbar{left:auto;inset-inline-end:16px;width:452px}
}

@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ---------- status / badges ---------- */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:17px;height:17px;padding:0 5px;border-radius:999px;
  background:var(--green);color:#04140c;font-family:var(--mono);
  font-size:9.5px;font-weight:500;line-height:1
}
.badge.zero{background:var(--line);color:var(--muted)}

.listbtn{
  position:fixed;z-index:612;top:calc(72px + env(safe-area-inset-top));
  inset-inline-start:16px;width:46px;height:46px;border-radius:15px;
  background:rgba(13,18,16,.9);border:1px solid var(--line);backdrop-filter:blur(10px);
  display:none;place-items:center;transition:transform .18s ease,border-color .18s ease
}
.listbtn:active{transform:scale(.93)}
.listbtn svg{width:19px;height:19px;stroke:var(--green);fill:none;stroke-width:1.7}
.listbtn .badge{position:absolute;top:-6px;inset-inline-start:-6px;
  background:var(--surface-2);color:var(--sand);border:1px solid var(--line)}

.adminbtn{
  position:fixed;z-index:611;inset-inline-end:14px;
  bottom:calc(var(--sheet-peek) + 74px + env(safe-area-inset-bottom));
  width:46px;height:46px;border-radius:15px;
  background:rgba(13,18,16,.9);border:1px solid var(--line);backdrop-filter:blur(10px);
  display:none;place-items:center;transition:transform .18s ease
}
.adminbtn.on{display:grid}
.adminbtn:active{transform:scale(.93)}
.adminbtn svg{width:19px;height:19px;stroke:var(--green);fill:none;stroke-width:1.6}
.adminbtn .badge{position:absolute;top:-6px;inset-inline-end:-6px}

/* ---------- tabs ---------- */
.tabs{flex:none;display:flex;gap:6px;padding:12px 18px 0}
.tabs button{
  flex:1;padding:9px 8px;border-radius:11px;background:var(--surface-2);
  font-size:12.5px;font-weight:600;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:color .16s ease,background .16s ease
}
.tabs button.on{color:#04140c;background:var(--green)}
.tabs button.on .badge{background:#04140c;color:var(--green)}

.pane{display:none}
.pane.on{display:block}

/* ---------- review card ---------- */
.review{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.review-top{display:flex;gap:11px;margin-bottom:10px}
.review-top .thumb{width:54px;height:54px;border-radius:12px}
.review-top div{flex:1;min-width:0}
.review-top h3{margin:0 0 3px;font-size:14.5px;font-weight:600;color:#e9efeb}
.review-top p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}
.review-story{
  font-size:12.5px;line-height:1.85;color:var(--sand);margin:0 0 12px;
  max-height:88px;overflow:hidden;position:relative
}
.review-meta{font-family:var(--mono);font-size:10px;color:var(--muted);margin:0 0 12px}
.actions{display:flex;gap:8px}
.actions button{flex:1;padding:11px;border-radius:12px;font-size:12.5px;font-weight:700}
.ok{background:var(--green);color:#04140c}
.no{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* ---------- report ---------- */
.reportbtn{
  width:100%;margin-top:18px;padding:12px;border-radius:13px;
  border:1px solid var(--line);background:transparent;
  font-size:12.5px;font-weight:600;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:8px
}
.reportbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.reportbtn:active{border-color:var(--green-dim);color:var(--sand)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{
  padding:9px 13px;border-radius:999px;border:1px solid var(--line);
  font-size:12.5px;color:var(--muted);transition:all .16s ease
}
.chips button.on{border-color:var(--green);color:var(--green);background:rgba(53,240,154,.08)}

.thread{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.bub{max-width:82%;padding:11px 14px;border-radius:15px;font-size:13px;line-height:1.7}
.bub.user{align-self:flex-start;background:var(--surface-2);border-end-start-radius:5px}
.bub.admin{align-self:flex-end;background:var(--green-deep);
  border:1px solid var(--green-dim);border-end-end-radius:5px}
.bub time{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:5px}

.composer-row{display:flex;gap:8px;align-items:flex-end}
.composer-row input{flex:1}
.composer-row button{
  flex:none;width:44px;height:44px;border-radius:13px;background:var(--green);
  display:grid;place-items:center
}
.composer-row button svg{width:17px;height:17px;stroke:#04140c;fill:none;stroke-width:2}
[dir=rtl] .composer-row button svg{transform:scaleX(-1)}
.composer-row button:disabled{opacity:.35}

.rcard{
  width:100%;text-align:start;border:1px solid var(--line);border-radius:15px;
  padding:13px 14px;margin-bottom:10px;display:block;transition:border-color .16s ease
}
.rcard:active{border-color:var(--green-dim)}
.rcard h3{margin:0 0 4px;font-size:13.5px;font-weight:600;color:#e9efeb}
.rcard p{margin:0 0 7px;font-size:12px;color:var(--muted);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .tagrow{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px}
.pill{padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.open{background:rgba(53,240,154,.11);color:var(--green)}

.sect{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.sect h4{margin:0 0 4px;font-size:12.5px;font-weight:600;color:#e6ece8}
.sect .sub{font-size:11px;color:var(--muted);margin:0 0 12px;line-height:1.65}
.strrow{margin-bottom:9px}
.strrow label{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);
  margin-bottom:4px;letter-spacing:.05em}
.strrow input,.strrow textarea{width:100%;background:#080c0a;border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;color:var(--sand);font-size:12.5px;
  outline:none;font-family:inherit;line-height:1.6}
.strrow textarea{resize:vertical;min-height:56px}
.strrow input:focus,.strrow textarea:focus{border-color:var(--green-dim)}
.strrow.dirty input,.strrow.dirty textarea{border-color:var(--green-dim)}
.minibtn{padding:10px 14px;border-radius:11px;background:var(--surface-2);
  border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--green)}
.sect .row{margin-bottom:0}

.gate{padding:34px 20px;text-align:center}
.gate h3{margin:0 0 8px;font-size:16px;font-weight:600;color:#e9efeb}
.gate p{margin:0 0 20px;font-size:12.5px;color:var(--muted);line-height:1.8}
.gate input{text-align:center;font-family:var(--mono);letter-spacing:.3em}

:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
</style>

function mergeFR(list){
  list.forEach(p => { if(FR_TR[p.id]){ p.tr = p.tr || {}; p.tr.fr = FR_TR[p.id]; } });
  const have = new Set(list.map(p => p.id));
  SEED.forEach(sd => {
    if(!have.has(sd.id)) list.push(sd);
    else { const p = list.find(x => x.id === sd.id); if(sd.wiki && !p.wiki) p.wiki = sd.wiki; }
  });
  return list;
}
mergeFR(SEED);

  name:'Spaccanapoli', country:'Italia', author:'Ciro, da Napoli',
  tag:'La strada dritta che taglia Napoli in due',
  story:'Una linea greca di duemila anni che attraversa il centro: botteghe, chiese barocche, panni stesi e motorini che passano a un palmo.\n\nMangia la pizza dove c\u0027è la fila di napoletani. E scendi a Napoli Sotterranea: la città continua sotto i tuoi piedi.',
  tr:{ ar:{ name:'سباكانابولي', country:'إيطاليا', author:'تشيرو من نابولي',
      tag:'الشارع المستقيم اللي يقسّم نابولي على زوز',
      story:'خط يوناني عمرو ألفين سنة يشقّ وسط المدينة: حوانت، كنايس باروكية، حوايج منشورة، ومطورات تعدّي جنبك.\n\nكول البيتزا وين تلقى الصف متاع أهل البلاد. وانزل لنابولي التحتانية: المدينة تتواصل تحت رجليك.' },
    en:{ name:'Spaccanapoli', country:'Italy', author:'Ciro, from Naples',
      tag:'The straight street that splits Naples in two',
      story:'A two-thousand-year-old Greek line cutting through the centre: workshops, baroque churches, laundry overhead and scooters passing inches away.\n\nEat pizza wherever the queue is Neapolitan. Then go down into Napoli Sotterranea — the city keeps going under your feet.' },
    fr:{ name:'Spaccanapoli', country:'Italie', author:'Ciro, de Naples',
      tag:'La rue droite qui coupe Naples en deux',
      story:"Une ligne grecque de deux mille ans qui traverse le centre : ateliers, églises baroques, linge tendu au-dessus et scooters qui frôlent.\n\nMange la pizza là où la file est napolitaine. Puis descends à Napoli Sotterranea : la ville continue sous tes pieds." } } },

{ id:'i5', lang:'it', lat:45.4430, lng:12.3300, wiki:'Cannaregio',
  name:'Cannaregio', country:'Italia', author:'Elena, da Venezia',
  tag:'La Venezia dove i veneziani vivono ancora',
  story:'A dieci minuti da San Marco e senza la folla: fondamenta lunghe sull\u0027acqua, bacari dove si mangiano i cicchetti in piedi, e il Ghetto, il primo del mondo.\n\nVai verso sera, quando i canali diventano arancioni e le barche della spesa rientrano.',
  tr:{ ar:{ name:'كانّاريجو', country:'إيطاليا', author:'إيلينا من البندقية',
      tag:'البندقية اللي أهلها باقين عايشين فيها',
      story:'عشر دقايق من سان ماركو وبلا زحمة: أرصفة طويلة على الماء، حوانت صغار تاكل فيهم واقف، والغيتو، أول واحد فالدنيا.\n\nامشي وقت العشية، كي القنوات تولي برتقالية والفلايك ترجع.' },
    en:{ name:'Cannaregio', country:'Italy', author:'Elena, from Venice',
      tag:'The Venice where Venetians still live',
      story:'Ten minutes from San Marco and none of the crowd: long quays along the water, bacari where you eat cicchetti standing up, and the Ghetto, the first one in the world.\n\nGo towards evening, when the canals turn orange and the delivery boats head home.' },
    fr:{ name:'Cannaregio', country:'Italie', author:'Elena, de Venise',
      tag:'La Venise où les Vénitiens vivent encore',
      story:"À dix minutes de Saint-Marc et sans la foule : de longs quais le long de l'eau, des bacari où l'on mange les cicchetti debout, et le Ghetto, le premier au monde.\n\nVas-y vers le soir, quand les canaux virent à l'orange et que les barques de livraison rentrent." } } },

{ id:'i6', lang:'it', lat:38.1110, lng:13.3600, wiki:'Palermo',
  name:'Ballarò, Palermo', country:'Italia', author:'Rosario, da Palermo',
  tag:'Un mercato arabo rimasto nel cuore della Sicilia',
  story:'Le voci dei venditori — l\u0027abbanniata — si sentono da due strade prima. Banchi di pesce, spezie e frutta sotto teli tirati fra i palazzi scrostati.\n\nMangia in piedi: panelle, sfincione, arancine. È il posto in Italia che assomiglia di più a un souk.',
  tr:{ ar:{ name:'باللارو، باليرمو', country:'إيطاليا', author:'روزاريو من باليرمو',
      tag:'سوق عربي باقي فقلب صقلية',
      story:'أصوات الباعة تسمعها من زوز شوارع قبل. طاولات حوت وتوابل وغلّة تحت أقمشة مشدودة بين البنايات القديمة.\n\nكول واقف: بانيلي، سفينشوني، أرانتشيني. هي البلاصة فإيطاليا الأقرب للسوق متاعنا.' },
    en:{ name:'Ballarò, Palermo', country:'Italy', author:'Rosario, from Palermo',
      tag:'An Arab market still beating in the heart of Sicily',
      story:'You hear the sellers calling — the abbanniata — two streets before you arrive. Fish, spices and fruit under sheets strung between peeling buildings.\n\nEat standing: panelle, sfincione, arancine. It is the place in Italy closest to a souk.' },
    fr:{ name:'Ballarò, Palerme', country:'Italie', author:'Rosario, de Palerme',
      tag:'Un marché arabe resté au cœur de la Sicile',
      story:"On entend les vendeurs — l'abbanniata — deux rues avant d'arriver. Poissons, épices et fruits sous des bâches tendues entre les façades écaillées.\n\nMange debout : panelle, sfincione, arancine. C'est l'endroit d'Italie qui ressemble le plus à un souk." } } }
];

const BULK_PLACES = [
{ id:'t14', lang:'ar', lat:36.8528, lng:10.3230, wiki:'Carthage',
  name:'قرطاج', country:'تونس', author:'ليلى من المرسى', tag:'اللي بقى من الإمبراطورية اللي حاربت روما',
  story:'حمّامات أنطونيوس على البحر ديركت، والتل البونيقي فوق. المدينة اللي خوّفت روما توّا حومة هادية.\n\nخوذ التي جي أم من تونس، ينزّلك بين المواقع وحدة وحدة.',
  tr:{ en:{ name:'Carthage', country:'Tunisia', author:'Leila, from La Marsa', tag:'What is left of the empire that fought Rome',
      story:'The Antonine Baths sit right on the sea, with the Punic hill above. The city that frightened Rome is now a quiet suburb.\n\nTake the TGM train from Tunis; it stops at the sites one by one.' },
    it:{ name:'Cartagine', country:'Tunisia', author:'Leila, da La Marsa', tag:"Ciò che resta dell'impero che sfidò Roma",
      story:'Le Terme di Antonino stanno proprio sul mare, con la collina punica sopra. La città che spaventò Roma oggi è un quartiere tranquillo.\n\nPrendi il treno TGM da Tunisi: ferma ai siti uno per uno.' },
    fr:{ name:'Carthage', country:'Tunisie', author:'Leila, de La Marsa', tag:"Ce qui reste de l'empire qui a défié Rome",
      story:"Les thermes d'Antonin donnent directement sur la mer, avec la colline punique au-dessus. La ville qui effrayait Rome est aujourd'hui une banlieue calme.\n\nPrends le TGM depuis Tunis : il dessert les sites un par un." } } },

{ id:'t15', lang:'ar', lat:36.7998, lng:10.1830, wiki:'Avenue Habib Bourguiba',
  name:'شارع الحبيب بورقيبة', country:'تونس', author:'مهدي من تونس', tag:'قلب العاصمة، والشارع اللي صار فيه كل شي',
  story:'شارع واسع بأشجار فالوسط، مسرح بلدي أبيض، وقهاوي على الرصيف. هوني تحس بالعاصمة كيما هي.\n\nامشيه عالعشية من ساعة أربعة، وقتها الناس تخرج والشارع يولي حي.',
  tr:{ en:{ name:'Avenue Habib Bourguiba', country:'Tunisia', author:'Mehdi, from Tunis', tag:'The spine of the capital, where everything happened',
      story:'A wide avenue with trees down the middle, a white municipal theatre, and pavement cafés. This is the capital as it actually is.\n\nWalk it in the late afternoon, when the city comes out.' },
    it:{ name:'Avenue Habib Bourguiba', country:'Tunisia', author:'Mehdi, da Tunisi', tag:'La spina dorsale della capitale, dove è successo tutto',
      story:'Un viale largo con alberi al centro, un teatro municipale bianco e caffè sul marciapiede. Qui la capitale è quella vera.\n\nPercorrilo nel tardo pomeriggio, quando la città esce di casa.' },
    fr:{ name:'Avenue Habib Bourguiba', country:'Tunisie', author:'Mehdi, de Tunis', tag:"L'artère de la capitale, où tout s'est joué",
      story:"Une large avenue avec des arbres au milieu, un théâtre municipal blanc et des cafés en terrasse. Ici, la capitale est celle de tous les jours.\n\nParcours-la en fin d'après-midi, quand la ville sort." } } },

{ id:'t16', lang:'ar', lat:36.8093, lng:10.1345, wiki:'Bardo National Museum (Tunis)',
  name:'متحف باردو', country:'تونس', author:'أسماء من باردو', tag:'أكبر مجموعة فسيفساء رومانية فالعالم',
  story:'قصر بايي معمّر بأرضيات فسيفساء كاملة، مرفوعة من فيلات رومانية فتونس كاملة. حاجة ما تلقاهاش حتى فروما.\n\nخصّصلو ساعتين على الأقل، وابدا بالطابق الفوقاني.',
  tr:{ en:{ name:'Bardo Museum', country:'Tunisia', author:'Asma, from Bardo', tag:'The largest collection of Roman mosaics on earth',
      story:'A beylical palace filled with complete mosaic floors, lifted from Roman villas across Tunisia. You will not see this even in Rome.\n\nGive it two hours minimum, and start on the upper floor.' },
    it:{ name:'Museo del Bardo', country:'Tunisia', author:'Asma, dal Bardo', tag:'La più grande raccolta di mosaici romani al mondo',
      story:'Un palazzo beylicale pieno di pavimenti a mosaico interi, staccati da ville romane di tutta la Tunisia. Non lo vedi nemmeno a Roma.\n\nCalcola almeno due ore e comincia dal piano superiore.' },
    fr:{ name:'Musée du Bardo', country:'Tunisie', author:'Asma, du Bardo', tag:'La plus grande collection de mosaïques romaines au monde',
      story:"Un palais beylical rempli de sols en mosaïque entiers, prélevés dans les villas romaines de toute la Tunisie. On ne voit pas ça, même à Rome.\n\nCompte deux heures minimum et commence par l'étage." } } },

{ id:'t17', lang:'ar', lat:36.4000, lng:10.6167, wiki:'Hammamet',
  name:'الحمامات', country:'تونس', author:'فرح من الحمامات', tag:'قصبة بيضاء على شط رملي',
  story:'القصبة القديمة واقفة ديركت على البحر، وتحتها مقبرة بيضا وشط. المدينة العتيقة صغيرة أما نظيفة وهادية.\n\nابعد على الزون السياحي الشمالي وقعد فالمدينة القديمة.',
  tr:{ en:{ name:'Hammamet', country:'Tunisia', author:'Farah, from Hammamet', tag:'A white kasbah on a sand beach',
      story:'The old kasbah stands straight on the sea, with a white cemetery and the beach below it. The medina is small, clean and calm.\n\nSkip the northern resort strip and stay in the old town.' },
    it:{ name:'Hammamet', country:'Tunisia', author:'Farah, da Hammamet', tag:'Una kasbah bianca su una spiaggia di sabbia',
      story:'La vecchia kasbah è a picco sul mare, con un cimitero bianco e la spiaggia sotto. La medina è piccola, pulita e tranquilla.\n\nEvita la zona alberghiera a nord e fermati nella città vecchia.' },
    fr:{ name:'Hammamet', country:'Tunisie', author:'Farah, de Hammamet', tag:'Une kasbah blanche sur une plage de sable',
      story:"La vieille kasbah tombe droit sur la mer, avec un cimetière blanc et la plage en dessous. La médina est petite, propre et calme.\n\nÉvite la zone hôtelière au nord et loge dans la vieille ville." } } },

{ id:'t18', lang:'ar', lat:36.4560, lng:10.7350, wiki:'Nabeul',
  name:'نابل', country:'تونس', author:'وليد من نابل', tag:'عاصمة الفخار وماء الزهر',
  story:'الفخار المزوّق بالأزرق والأصفر يتصنع هوني من قرون، والسوق متاع الجمعة أكبر سوق فالجهة.\n\nفي أفريل، ريحة ماء الزهر تعمّر البلاد كاملة.',
  tr:{ en:{ name:'Nabeul', country:'Tunisia', author:'Walid, from Nabeul', tag:'Capital of pottery and orange blossom water',
      story:'Blue and yellow painted pottery has been made here for centuries, and the Friday market is the biggest in the region.\n\nIn April the smell of orange blossom fills the whole town.' },
    it:{ name:'Nabeul', country:'Tunisia', author:'Walid, da Nabeul', tag:"Capitale della ceramica e dell'acqua di fiori d'arancio",
      story:"Qui si dipinge ceramica blu e gialla da secoli, e il mercato del venerdì è il più grande della zona.\n\nAd aprile il profumo dei fiori d'arancio invade tutta la città." },
    fr:{ name:'Nabeul', country:'Tunisie', author:'Walid, de Nabeul', tag:"Capitale de la poterie et de l'eau de fleur d'oranger",
      story:"On y peint de la poterie bleue et jaune depuis des siècles, et le marché du vendredi est le plus grand de la région.\n\nEn avril, l'odeur de fleur d'oranger envahit toute la ville." } } },

{ id:'t19', lang:'ar', lat:35.5040, lng:11.0620, wiki:'Mahdia',
  name:'المهدية', country:'تونس', author:'سيف من المهدية', tag:'مدينة على لسان أرض، محاطة بالبحر من تلاث جيهات',
  story:'باب سقيفة الكحلة يفتحلك على مدينة عتيقة صغيرة، وفآخرها المقبرة البحرية والبرج. الماء أزرق فاتح وصافي.\n\nهي أهدى من سوسة والحمامات بمرّات، والحوت فيها أطرى.',
  tr:{ en:{ name:'Mahdia', country:'Tunisia', author:'Seif, from Mahdia', tag:'A town on a headland, sea on three sides',
      story:'Skifa el Kahla opens onto a small medina that ends at the sea cemetery and the fort. The water is pale blue and clear.\n\nIt is far quieter than Sousse or Hammamet, and the fish is fresher.' },
    it:{ name:'Mahdia', country:'Tunisia', author:'Seif, da Mahdia', tag:'Una città su un promontorio, mare su tre lati',
      story:'Skifa el Kahla apre su una piccola medina che finisce al cimitero sul mare e al forte. L\u0027acqua è azzurra e limpida.\n\nÈ molto più tranquilla di Sousse o Hammamet, e il pesce è più fresco.' },
    fr:{ name:'Mahdia', country:'Tunisie', author:'Seif, de Mahdia', tag:'Une ville sur une pointe, la mer sur trois côtés',
      story:"Skifa el Kahla ouvre sur une petite médina qui finit au cimetière marin et au fort. L'eau est bleu clair et limpide.\n\nBien plus calme que Sousse ou Hammamet, et le poisson y est plus frais." } } },

{ id:'t20', lang:'ar', lat:33.5440, lng:9.9700, wiki:'Matmata, Tunisia',
  name:'مطماطة', country:'تونس', author:'نجيب من مطماطة', tag:'ديار محفورة تحت الأرض فالصحرا',
  story:'حفرة كبيرة فالأرض، وحواليها بيوت محفورة فالحيط. البناية هاذي تخلي الصيف بارد والشتاء دافي.\n\nناس باقين ساكنين فيها بصح، موش متحف. اسأل قبل ما تصوّر.',
  tr:{ en:{ name:'Matmata', country:'Tunisia', author:'Najib, from Matmata', tag:'Houses dug underground in the desert',
      story:'A wide pit in the ground with rooms carved into its walls. The design keeps summers cool and winters warm.\n\nPeople still live in them — this is not a museum. Ask before you photograph.' },
    it:{ name:'Matmata', country:'Tunisia', author:'Najib, da Matmata', tag:'Case scavate sottoterra nel deserto',
      story:'Una grande fossa nel terreno con stanze scavate nelle pareti. Il sistema tiene fresco d\u0027estate e caldo d\u0027inverno.\n\nCi vive ancora gente: non è un museo. Chiedi prima di fotografare.' },
    fr:{ name:'Matmata', country:'Tunisie', author:'Najib, de Matmata', tag:'Des maisons creusées sous terre dans le désert',
      story:"Une large fosse dans le sol, avec des pièces creusées dans les parois. Le principe garde le frais l'été et le chaud l'hiver.\n\nDes gens y vivent encore : ce n'est pas un musée. Demande avant de photographier." } } },

{ id:'t21', lang:'ar', lat:34.6900, lng:11.2100, wiki:'Kerkennah Islands',
  name:'قرقنة', country:'تونس', author:'هيثم من صفاقس', tag:'جزر مسطحة، صيد بالشرفية، وهدوء تام',
  story:'ما فماش لا مرتفعات لا فنادق كبار — نخل، ماء ضحل، وطريقة صيد قديمة بالجريد ما بقاتش كان هوني.\n\nالباخرة من صفاقس ساعة ونص. اجي وقت الغروب.',
  tr:{ en:{ name:'Kerkennah Islands', country:'Tunisia', author:'Haythem, from Sfax', tag:'Flat islands, palm-frond fishing, total quiet',
      story:'No hills, no big hotels — just palms, shallow water and an old fishing method with palm fronds that survives only here.\n\nThe ferry from Sfax takes ninety minutes. Come for sunset.' },
    it:{ name:'Isole Kerkennah', country:'Tunisia', author:'Haythem, da Sfax', tag:'Isole piatte, pesca con le foglie di palma, silenzio totale',
      story:'Niente colline, niente grandi alberghi — solo palme, acqua bassa e un antico metodo di pesca con le fronde, rimasto solo qui.\n\nIl traghetto da Sfax impiega un\u0027ora e mezza. Vieni al tramonto.' },
    fr:{ name:'Îles Kerkennah', country:'Tunisie', author:'Haythem, de Sfax', tag:'Des îles plates, la pêche aux palmes, un calme total',
      story:"Pas de collines, pas de grands hôtels — des palmiers, une eau basse et une pêche ancienne aux palmes qui ne survit qu'ici.\n\nLe bac depuis Sfax met une heure et demie. Viens au coucher du soleil." } } },

{ id:'t22', lang:'ar', lat:34.3190, lng:7.9250, wiki:'Chebika',
  name:'شبيكة', country:'تونس', author:'رانية من توزر', tag:'واحة جبلية وشلال فوسط الحجر',
  story:'قرية قديمة مهجورة تحت الجبل، وممر ضيّق يوصلك لعين ماء وشلال صغير وسط النخل.\n\nكمّل لتمغزة وميداس فنفس النهار — الطريق بينهم خيالي.',
  tr:{ en:{ name:'Chebika', country:'Tunisia', author:'Rania, from Tozeur', tag:'A mountain oasis and a waterfall in bare rock',
      story:'An abandoned old village under the cliff, and a narrow gorge leading to a spring and a small waterfall among palms.\n\nDo Tamerza and Mides the same day — the road between them is unreal.' },
    it:{ name:'Chebika', country:'Tunisia', author:'Rania, da Tozeur', tag:'Un\u0027oasi di montagna e una cascata nella roccia nuda',
      story:'Un vecchio villaggio abbandonato sotto la rupe, e una gola stretta che porta a una sorgente e a una piccola cascata tra le palme.\n\nFai Tamerza e Mides lo stesso giorno: la strada è irreale.' },
    fr:{ name:'Chebika', country:'Tunisie', author:'Rania, de Tozeur', tag:'Une oasis de montagne et une cascade dans la roche nue',
      story:"Un vieux village abandonné sous la falaise, et une gorge étroite qui mène à une source et à une petite cascade au milieu des palmiers.\n\nFais Tamerza et Midès le même jour : la route est irréelle." } } },

{ id:'t23', lang:'ar', lat:36.5580, lng:8.7540, wiki:'Bulla Regia',
  name:'بلا ريجيا', country:'تونس', author:'منير من جندوبة', tag:'فيلات رومانية تحت الأرض، بفسيفساء باقية فبلاصتها',
  story:'الرومان حفرو طابق تحتاني باش يهربو من السخانة. تنزل بالدرج وتلقى الفسيفساء باقية فأرضها من ألفين سنة.\n\nهي الموقع الوحيد فالدنيا اللي فيه هالبناية.',
  tr:{ en:{ name:'Bulla Regia', country:'Tunisia', author:'Mounir, from Jendouba', tag:'Underground Roman villas with mosaics still in place',
      story:'The Romans dug a lower floor to escape the heat. You walk down the stairs and the mosaics are still on the ground where they were laid.\n\nIt is the only site in the world built this way.' },
    it:{ name:'Bulla Regia', country:'Tunisia', author:'Mounir, da Jendouba', tag:'Ville romane sotterranee con i mosaici ancora al loro posto',
      story:'I Romani scavarono un piano interrato per sfuggire al caldo. Scendi le scale e i mosaici sono ancora sul pavimento dove furono posati.\n\nÈ l\u0027unico sito al mondo costruito così.' },
    fr:{ name:'Bulla Regia', country:'Tunisie', author:'Mounir, de Jendouba', tag:'Des villas romaines souterraines, mosaïques encore en place',
      story:"Les Romains ont creusé un étage enterré pour fuir la chaleur. Tu descends l'escalier et les mosaïques sont toujours au sol, là où on les a posées.\n\nC'est le seul site au monde bâti ainsi." } } },

{ id:'i7', lang:'it', lat:41.8902, lng:12.4922, wiki:'Colosseum',
  name:'Colosseo', country:'Italia', author:'Marco, da Roma', tag:"L'anfiteatro che ha dato la forma a tutti gli stadi",
  story:'Cinquantamila spettatori, e sotto l\u0027arena un labirinto di gallerie e ascensori per le belve. Il biglietto vale anche per il Foro e il Palatino.\n\nPrenota online e entra alle 8:30, prima dei gruppi.',
  tr:{ ar:{ name:'الكولوسيوم', country:'إيطاليا', author:'ماركو من روما', tag:'المدرج اللي عطى الشكل لكل الملاعب من بعدو',
      story:'خمسين ألف متفرّج، وتحت الحلبة متاهة أنفاق ومصاعد للوحوش. التذكرة تخدم زادة للمنتدى والبالاتين.\n\nاحجز فالأنترنات وادخل الثمنية ونص، قبل الأفواج.' },
    en:{ name:'Colosseum', country:'Italy', author:'Marco, from Rome', tag:'The amphitheatre every stadium since has copied',
      story:'Fifty thousand spectators, and under the arena a maze of tunnels and lifts for the animals. The ticket covers the Forum and Palatine too.\n\nBook online and go in at 8:30, ahead of the tour groups.' },
    fr:{ name:'Colisée', country:'Italie', author:'Marco, de Rome', tag:"L'amphithéâtre que tous les stades ont copié depuis",
      story:"Cinquante mille spectateurs, et sous l'arène un labyrinthe de galeries et d'ascenseurs pour les fauves. Le billet couvre aussi le Forum et le Palatin.\n\nRéserve en ligne et entre à 8h30, avant les groupes." } } },

{ id:'i8', lang:'it', lat:41.8986, lng:12.4769, wiki:'Pantheon, Rome',
  name:'Pantheon', country:'Italia', author:'Marco, da Roma', tag:'La cupola in calcestruzzo più grande mai costruita, dal 126 d.C.',
  story:'Nessuna finestra: la luce entra da un buco di nove metri nel soffitto e gira sulle pareti durante la giornata. È ancora la cupola non armata più grande del mondo.\n\nEntra quando piove — la pioggia cade dentro e scorre via dal pavimento.',
  tr:{ ar:{ name:'البانثيون', country:'إيطاليا', author:'ماركو من روما', tag:'أكبر قبة إسمنتية اتبنات فالتاريخ، من سنة 126',

/* ---------- photos pulled from Wikipedia when nobody uploaded one ---------- */
const photoCache = {};
const SKIP = /(icon|logo|flag|coat[_ ]of[_ ]arms|\bmap\b|blank|commons|wiki|edit|symbol|location|stub|question|ambox|arrow|star|disambig|padlock)/i;
const OKMIME = /^image\/(jpeg|png|webp)$/;

// only keep a url once the browser has actually decoded it
function loadable(src){
  return new Promise(res => {
    const im = new Image();
    im.onload  = () => res(im.naturalWidth >= 200);
    im.onerror = () => res(false);
    im.src = src;
  });
}

async function candidates(raw){
  const out = [];
  // 1) let MediaWiki build the thumbnail — it clamps to the original width,
  //    so the url is always one that exists (hand-made widths 404).
  try{
    const r = await fetch('https://' + (raw.host || 'en') + '.wikipedia.org/w/api.php'
      + '?action=query&format=json&origin=*&generator=images&gimlimit=25'
      + '&prop=imageinfo&iiprop=url|mime&iiurlwidth=1000&titles='
      + encodeURIComponent(raw.wiki));
    const j = await r.json();
    Object.values((j.query && j.query.pages) || {}).forEach(pg => {
      const ii = pg.imageinfo && pg.imageinfo[0];
      if(!ii || !OKMIME.test(ii.mime || '')) return;
      if(SKIP.test(pg.title || '')) return;
      if(ii.thumburl) out.push(ii.thumburl);
      else if(ii.url) out.push(ii.url);
    });
  }catch(e){}
  // 2) fallback: whatever the page preview offers, untouched
  if(!out.length){
    try{
      const r = await fetch('https://' + (raw.host || 'en') + '.wikipedia.org/w/api.php'
        + '?action=query&prop=pageimages&format=json&pithumbsize=1000&origin=*&titles='
        + encodeURIComponent(raw.wiki));
      const j = await r.json();
      const pg = Object.values(j.query.pages)[0];
      if(pg && pg.thumbnail) out.push(pg.thumbnail.source);
    }catch(e){}
  }
  return out;
}

async function wikiPhotos(raw){
  if(photoCache[raw.id]) return photoCache[raw.id];
  photoCache[raw.id] = [];
  if(!raw.wiki) return [];
  const cands = (await candidates(raw)).slice(0, 14);
  const ok = await Promise.all(cands.map(loadable));
  photoCache[raw.id] = cands.filter((_, i) => ok[i]).slice(0, 5);
  return photoCache[raw.id];
}

let hydrateT;
async function hydratePhotos(){
  const todo = places.filter(p => p.wiki && !(p.photos && p.photos.length) && !p.wikiPhotos);
  const got = await Promise.all(todo.map(async raw => {
    const list = await wikiPhotos(raw);
    if(list.length){ raw.wikiPhotos = list; raw.wikiPhoto = list[0]; return true; }
    return false;
  }));
  if(got.some(Boolean)){
    clearTimeout(hydrateT);
    hydrateT = setTimeout(() => {
      render();
      if(activeId && $('detail').classList.contains('on')) fillDetail(activeId);
    }, 120);
  }
}

/* ============================================================
   Every town, from Wikipedia's geosearch — instead of a hand-written list.
   Curated places (with a local's story) stay in `places`;
   whatever the map is showing gets filled in from `found`, in memory only.
   ============================================================ */
let found = [];
let discoverT = null;
const summaryCache = {};

function allPlaces(){
  return places.filter(p => (p.status || 'approved') === 'approved').concat(found);
}

async function discover(){
  if(map.getZoom() < 10){
    if(found.length){ found = []; render(); }
    return;
  }
  const c = map.getCenter();
  const host = lang + '.wikipedia.org';
  try{
    const r = await fetch('https://' + host + '/w/api.php?action=query&format=json&origin=*'
      + '&list=geosearch&gsradius=10000&gslimit=60&gsprimary=primary'
      + '&gscoord=' + c.lat + '%7C' + c.lng);
    const j = await r.json();
    const hits = (j.query && j.query.geosearch) || [];
    const mine = new Set();
    places.forEach(pl => {
      const names = [pl.name].concat(pl.tr ? Object.values(pl.tr).map(t => t && t.name) : []);
      names.forEach(nm => nm && mine.add(nm.toLowerCase()));
    });
    found = hits
      .filter(it => !mine.has(it.title.toLowerCase()))
      .map(it => ({
        id:'w' + it.pageid, discovered:true, host:lang, wiki:it.title, lang,
        name:it.title, country:'', tag:'', story:'', author:'Wikipedia',
        lat:it.lat, lng:it.lon
      }));
    render();
  }catch(e){}
}
function scheduleDiscover(){
  clearTimeout(discoverT);
  discoverT = setTimeout(discover, 450);
}

// text + photo for a discovered place, fetched only when it is opened
async function loadSummary(raw){
  if(raw.story) return;
  const key = raw.host + ':' + raw.wiki;
  if(summaryCache[key]){ Object.assign(raw, summaryCache[key]); return; }
  try{
    const r = await fetch('https://' + raw.host + '.wikipedia.org/api/rest_v1/page/summary/'
      + encodeURIComponent(raw.wiki.replace(/ /g, '_')));
    const j = await r.json();
    const data = {
      tag: j.description || '',
      story: j.extract || '',
      country: (j.description || '').split(',').pop().trim()
    };
    if(j.thumbnail && j.thumbnail.source) data.wikiPhoto = j.thumbnail.source;
    summaryCache[key] = data;
    Object.assign(raw, data);
  }catch(e){}
}

let T = L10N.ar;

function view(p){
  const tr = p.tr && p.tr[lang];
  const translated = !!tr || p.lang === lang;
  return {
    ...p,
    name: (tr && tr.name) || p.name,
    country: (tr && tr.country) || p.country,
    author: (tr && tr.author) || p.author,
    tag: (tr && tr.tag) || p.tag,
    story: (tr && tr.story) || p.story,
    shot: (p.photos && p.photos[0]) || p.wikiPhoto || null,
    translated
  };
}

  lang = code;
  T = Object.assign({}, L10N[code], overrides[code] || {});
  document.documentElement.lang = code;
  document.documentElement.dir = T.dir;
  document.body.dir = T.dir;

  $('brandSub').textContent = settings.sub;

    el.textContent = T[el.dataset.i18n] || '';
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = T[el.dataset.i18nPh] || '';
  });
  $('fLocLabel').textContent = draft.lat === null ? T.noLoc
    : (draft.src === 'me' ? T.yourLoc : T.pickedLoc);
  document.querySelectorAll('#langs button').forEach(b => {
    b.classList.toggle('on', b.dataset.lang === code);
  });

  renderReasons();
  renderSite();
  found = [];
  scheduleDiscover();
  applyEditLabels();
  validate();
  render();

    if(reportCtx.reportId) renderThread(); else $('reportHead').textContent = T.reportTitle;

  db.set('masalek:lang', code);
}

/* ---------- storage ---------- */
// window.storage works inside the Claude preview; localStorage works when the
// file is opened directly or hosted. Memory only if both are unavailable.
const mem = {};
const db = {
  async get(k){
    try{ const r = await window.storage.get(k); if(r && r.value) return r.value; }catch(e){}
    try{ const v = localStorage.getItem(k); if(v) return v; }catch(e){}
    return mem[k] || null;
  },
  async set(k, v){
    mem[k] = v;
    try{ await window.storage.set(k, v); }catch(e){}
    try{ localStorage.setItem(k, v); }catch(e){}
  }
};

/* ---------- geo helpers ---------- */
const R = 6371;
const rad = d => d*Math.PI/180;
function distanceKm(a,b,c,d){
  const dLat = rad(c-a), dLng = rad(d-b);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a,b,c,d){
  const y = Math.sin(rad(d-b))*Math.cos(rad(c));
  const x = Math.cos(rad(a))*Math.sin(rad(c)) - Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(rad(d-b));
  return (Math.atan2(y,x)*180/Math.PI + 360) % 360;
}
function fmtDist(km){
  if(km < 1) return Math.round(km*1000) + ' ' + T.m;
  if(km < 10) return km.toFixed(1) + ' ' + T.km;
  return Math.round(km) + ' ' + T.km;
}

/* ---------- contour placeholder ---------- */
function contour(seedText, w, h){
  let s = 0;
  for(let i=0;i<seedText.length;i++) s = (s*31 + seedText.charCodeAt(i)) % 100000;
  const rnd = () => (s = (s*9301 + 49297) % 233280) / 233280;
  const cx = w*(.3+rnd()*.4), cy = h*(.3+rnd()*.4);
  let paths = '';
  for(let r=6; r<Math.max(w,h)*.95; r+=Math.max(7, w*.09)){
    let d = '';
    for(let a=0; a<=360; a+=18){
      const wob = 1 + (rnd()-.5)*.34;
      d += (a===0?'M':'L') + (cx + Math.cos(rad(a))*r*wob).toFixed(1) + ' '
                           + (cy + Math.sin(rad(a))*r*wob*.72).toFixed(1);
    }
    paths += '<path d="'+d+'Z" fill="none" stroke="#35f09a" stroke-opacity="'
           + (.42 - r/(w*3.4)).toFixed(2) + '" stroke-width="1"/>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'
       + '<rect width="'+w+'" height="'+h+'" fill="#07361f"/>'+paths+'</svg>';
}

const WORLD = L.latLngBounds([[-85, -180], [85, 180]]);
const map = L.map('map', {
  zoomControl:false,
  worldCopyJump:false,
  maxBounds:WORLD,
  maxBoundsViscosity:1
}).setView([34.6, 9.6], 6);

/* Three basemaps, switchable from the admin panel:
     green   — plain OpenStreetMap, inverted in CSS. Rock solid, never needs a key.
               Labels are in each country's own script.
     english — Wikimedia's osm-intl, same look, all labels in English, but the
               service goes down sometimes.
     grey    — Esri dark canvas, English labels, already dark. */
const OSM_PLAIN = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const OSM_INTL  = 'https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png?lang=en';
const esri = u => 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/'
  + u + '/MapServer/tile/{z}/{y}/{x}';

const tiles = L.tileLayer(OSM_PLAIN, {
  maxZoom:19, noWrap:true, bounds:WORLD,
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

let esriLabels = null;
function dropEsri(){
  if(esriLabels){ map.removeLayer(esriLabels); esriLabels = null; }
}
function setBasemap(kind){
  if(kind === 'grey'){
    document.body.classList.add('darkbase');
    tiles.setUrl(esri('World_Dark_Gray_Base'));
    if(!esriLabels){
      esriLabels = L.tileLayer(esri('World_Dark_Gray_Reference'),
        { maxZoom:19, maxNativeZoom:16, noWrap:true, bounds:WORLD, pane:'overlayPane' })
        .addTo(map);
    }
    return;
  }
  dropEsri();
  document.body.classList.remove('darkbase');
  tiles.setUrl(kind === 'english' ? OSM_INTL : OSM_PLAIN);
}

/* If the English tiles are picked and the service is down, come back to plain
   OSM instead of leaving a blank screen. */
let tilesOK = false, tileFails = 0;
tiles.on('tileload', () => { tilesOK = true; });
tiles.on('tileerror', () => {
  if(tilesOK || settings.basemap !== 'english') return;
  if(++tileFails >= 12){ settings.basemap = 'green'; setBasemap('green'); renderSite(); }
});

// never let the viewport get wider or taller than one world
function clampZoom(){
  const z = map.getBoundsZoom(WORLD, true);
  map.setMinZoom(z);
  if(map.getZoom() < z) map.setZoom(z);
}
clampZoom();
window.addEventListener('resize', clampZoom);
map.on('moveend zoomend', () => scheduleDiscover());

/* ---------- render ---------- */
function render(){
  const live = allPlaces();
  const q = query.trim().toLowerCase();
  const hit = (raw, p) => !q || [p.name, p.country, p.tag, p.story, raw.name, raw.country]
    .some(v => v && String(v).toLowerCase().includes(q));
  const rows = live.map(raw => ({ raw, v:view(raw) })).filter(o => hit(o.raw, o.v)).map(({v:p}) => ({
    ...p,
    d: me ? distanceKm(me.lat, me.lng, p.lat, p.lng) : null,
    b: me ? bearing(me.lat, me.lng, p.lat, p.lng) : null
  }));
  if(me) rows.sort((a,b) => a.d - b.d);

  $('listTitle').textContent = q ? T.resultsFor : me ? T.nearYou : T.onMap;
  $('listCount').textContent = String(rows.length).padStart(2,'0');
  $('listBtnCount').textContent = rows.length;

  if(!rows.length){
    listEl.innerHTML = q
      ? '<div class="empty">'+esc(T.noResults)+'</div>'
      : map.getZoom() < 10
        ? '<div class="zoomhint">'+esc(T.zoomIn)+'</div>'
        : '<div class="empty"><strong>'+esc(T.emptyT)+'</strong>'+esc(T.emptyB)+'</div>';
  } else {
    listEl.innerHTML = rows.map(p =>
      '<button class="card' + (p.discovered ? ' wiki' : '') + '" data-id="'+p.id+'">'
      + '<span class="thumb">'
      + (p.shot
          ? '<img src="'+p.shot+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
          : contour(p.id+p.name, 88, 88))
      + '</span>'
      + '<span class="card-body"><h3>'+esc(p.name)
      + (p.discovered ? '<span class="wikipill">'+esc(T.discovered)+'</span>' : '')
      + '</h3><p>'+esc(p.tag || p.story || '')+'</p></span>'
      + '<span class="meta">'
      + (p.d !== null
          ? '<svg class="bearing" viewBox="0 0 24 24" style="transform:rotate('+p.b+'deg)">'
            + '<path d="M12 3l7 17-7-4-7 4z"/></svg>'
            + '<span class="dist">'+fmtDist(p.d)+'</span>'
          : '')
      + '</span></button>'
    ).join('');
  }

  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  live.filter(raw => hit(raw, view(raw))).forEach(p => {
    markers[p.id] = L.marker([p.lat, p.lng],
      { icon: pinIcon(p.id === activeId, p.discovered) })
      .addTo(map).on('click', () => openDetail(p.id));
  });
}

/* ---------- geolocation ---------- */
function setMe(lat, lng, acc, fly){
  me = { lat, lng, acc };
  $('lock').textContent = '●';
  $('lock').classList.remove('off');
  $('acc').textContent = acc ? '\u00b1' + Math.round(acc) + 'm' : T.posManual;
  $('coords').textContent = lat.toFixed(4) + ' / ' + lng.toFixed(4);

  if(meMarker) map.removeLayer(meMarker);
  meMarker = L.marker([lat, lng], { icon:meIcon, zIndexOffset:1000 }).addTo(map);

  if(accCircle){ map.removeLayer(accCircle); accCircle = null; }
  if(acc && acc > 80){                       // draw how uncertain the fix really is
    accCircle = L.circle([lat, lng], { radius:acc, color:'#35f09a', weight:1,
      opacity:.3, fillColor:'#35f09a', fillOpacity:.05 }).addTo(map);
  }
  if(fly) map.flyTo([lat, lng], acc > 5000 ? 9 : acc > 500 ? 12 : 14, { duration:1 });
  render();
  setSheet(true);
}

function stopWatch(){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
}

/* One reading is usually the coarse network guess. Keep listening and take each
   better fix as it arrives, instead of settling for the first one. */
function locate(){
  if(!navigator.geolocation){ toast(T.tNoGeo); return; }
  $('btnLocate').classList.add('on');
  bestAcc = Infinity;
  stopWatch();
  let flown = false;
  watchId = navigator.geolocation.watchPosition(pos => {
    const acc = pos.coords.accuracy;
    if(acc >= bestAcc) return;
    bestAcc = acc;
    setMe(pos.coords.latitude, pos.coords.longitude, acc, !flown);
    flown = true;
    if(acc <= 60) stopWatch();
    else if(acc > 2000) toast(T.posApprox);
  }, err => {
    stopWatch();
    $('btnLocate').classList.remove('on');
    toast(err.code === 1 ? T.tDenied : T.tNotFound);
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
  setTimeout(stopWatch, 25000);
}

/* ---------- sheet drag ---------- */
const sheet = $('sheet'), grip = $('grip');
let dragY = null, startOpen = false;
grip.addEventListener('pointerdown', e => {
  dragY = e.clientY; startOpen = sheet.classList.contains('open');
  sheet.classList.add('dragging'); grip.setPointerCapture(e.pointerId);
});
grip.addEventListener('pointermove', e => {
  if(dragY === null) return;
  const peek = sheet.offsetHeight -
    parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sheet-peek'));
  const base = startOpen ? 0 : peek;
  sheet.style.transform = 'translateY(' + Math.min(peek, Math.max(0, base + (e.clientY - dragY))) + 'px)';
});
grip.addEventListener('pointerup', e => {
  if(dragY === null) return;
  const moved = e.clientY - dragY;
  sheet.classList.remove('dragging');
  sheet.style.transform = '';
  if(Math.abs(moved) < 6) setSheet(!sheet.classList.contains('open'));
  else if(moved < -40) setSheet(true);
  else if(moved > 40) setSheet(false);
  dragY = null;
});

  openPanel('composer');
});

function shrink(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1100;
        let w = img.width, h = img.height;
        if(w > max || h > max){ const s = max/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', .72));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* save */
['fName','fCountry','fStory'].forEach(id => $(id).addEventListener('input', validate));
// one entry per spot: refuse a second place on top of an existing one
function nearestClash(){
  if(draft.lat === null) return null;
  const lim = Math.max(0, +settings.minDist || 0) / 1000;
  if(!lim) return null;
  let best = null;
  places.forEach(raw => {
    if(raw.id === editId) return;
    const d = distanceKm(draft.lat, draft.lng, raw.lat, raw.lng);
    if(d < lim && (!best || d < best.d)) best = { raw, d };
  });
  return best;
}
function nameClash(){
  const v = $('fName').value.trim().toLowerCase();
  if(v.length < 3) return null;
  return places.find(raw => {
    if(raw.id === editId) return false;
    const names = [raw.name].concat(raw.tr ? Object.values(raw.tr).map(t => t && t.name) : []);
    return names.some(nm => nm && nm.toLowerCase() === v);
  }) || null;
}

function validate(){
  const miss = [];
  if(draft.lat === null) miss.push(T.needLoc);
  if(!$('fName').value.trim()) miss.push(T.needName);
  if($('fStory').value.trim().length <= 24) miss.push(T.needStory);

  const near = nearestClash();
  const same = near ? null : nameClash();
  const clash = near ? near.raw : same;

  if(clash){
    const nm = view(clash).name;
    $('saveHint').innerHTML =
      '<b>' + esc(near ? T.tooClose : T.sameName) + ' ' + esc(nm) + '</b>'
      + (near ? ' — ' + esc(fmtDist(near.d)) : '')
      + '<br>' + esc(T.mergeHint)
      + '<br><button id="hintOpen" data-id="' + clash.id + '">' + esc(T.seeIt) + '</button>';
    $('saveHint').classList.add('on');
    $('btnSave').disabled = true;
    $('locRow').classList.add('needed');
    return;
  }

  $('btnSave').disabled = miss.length > 0;
  $('saveHint').textContent = miss.length ? T.missing + ' ' + miss.join(' · ') : '';
  $('saveHint').classList.toggle('on', miss.length > 0);
  $('locRow').classList.toggle('needed', draft.lat === null);
}

$('saveHint').addEventListener('click', e => {

$('btnSave').addEventListener('click', async () => {
  const fields = {
    name:$('fName').value.trim(),
    country:$('fCountry').value.trim() || '—',
    tag:$('fTag').value.trim(),
    story:$('fStory').value.trim(),
    author:$('fAuthor').value.trim() || T.anon
  };

  if(editId){
    const raw = places.find(x => x.id === editId);
    if(raw.lang === lang) Object.assign(raw, fields);
    else {
      raw.tr = raw.tr || {};
      raw.tr[lang] = Object.assign({}, raw.tr[lang] || {}, fields);
    }
    raw.lat = draft.lat; raw.lng = draft.lng; raw.photos = draft.photos.slice();
    store.cache = places;
    await store.save();
    resetComposer(); closePanels(); render(); renderAdmin();
    toast(T.tSaved);
    return;
  }

  places.push(Object.assign({
    id:'u' + Date.now(), lang, status:'pending', by:deviceId, at:Date.now(),
    lat:draft.lat, lng:draft.lng, photos:draft.photos.slice()
  }, fields));

});

function renderSite(){
  if(!isAdmin || !$('paneSite')) return;
  const base = L10N[lang], ov = overrides[lang] || {};
  const keys = Object.keys(base).filter(k => k !== 'dir' && k !== 'label');
  const f = strFilter.trim().toLowerCase();
  const shown = keys.filter(k => !f || k.toLowerCase().includes(f)
    || String(base[k]).toLowerCase().includes(f)
    || String(ov[k] || '').toLowerCase().includes(f));

  $('paneSite').innerHTML =
    '<div class="sect"><h4>' + esc(T.siteBrand) + '</h4>'
    + '<div class="row">'
    + '<div class="strrow"><label>' + esc(T.siteBrand) + '</label>'
    + '<input data-set="brand" value="' + esc(settings.brand) + '" placeholder="' + esc(T.brand) + '"></div>'
    + '<div class="strrow"><label>' + esc(T.siteSub) + '</label>'
    + '<input data-set="sub" value="' + esc(settings.sub) + '"></div>'
    + '</div></div>'

    + '<div class="sect"><h4>' + esc(T.siteMap) + '</h4>'
    + '<p class="sub">' + settings.lat.toFixed(4) + ' / ' + settings.lng.toFixed(4)
    + ' · zoom ' + settings.zoom + '</p>'
    + '<button class="minibtn" id="btnUseView">' + esc(T.useCurrentView) + '</button></div>'

    + '<div class="sect"><h4>' + esc(T.siteCode) + '</h4>'
    + '<div class="strrow"><input data-set="code" value="' + esc(settings.code) + '"></div></div>'

    + '<div class="sect"><h4>' + esc(T.baseLabel) + '</h4>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + ['green','english','grey'].map(k =>
        '<button class="minibtn" data-base="' + k + '"'
        + (settings.basemap === k ? ' style="border-color:var(--green-dim)"' : '')
        + '>' + esc(k === 'green' ? T.baseGreen : k === 'english' ? T.baseEnglish : T.baseGrey)
        + '</button>').join('')
    + '</div></div>'

    + '<div class="sect"><h4>' + esc(T.minDistLabel) + '</h4>'
    + '<div class="strrow"><input data-set="minDist" inputmode="numeric" value="'
    + esc(settings.minDist) + '"></div></div>'

    + '<div class="sect"><h4>' + esc(T.siteTexts) + '</h4>'
    + '<p class="sub">' + esc(T.siteTextsHint) + '</p>'
    + '<div class="strrow"><input id="strFilter" placeholder="' + esc(T.filterPh)
    + '" value="' + esc(strFilter) + '"></div>'
    + shown.map(k => {
        const val = ov[k] !== undefined ? ov[k] : base[k];
        const long = String(base[k]).length > 52;
        return '<div class="strrow' + (ov[k] !== undefined ? ' dirty' : '') + '">'
          + '<label>' + k + '</label>'
          + (long
              ? '<textarea data-str="' + k + '">' + esc(val) + '</textarea>'
              : '<input data-str="' + k + '" value="' + esc(val) + '">')
          + '</div>';
      }).join('')
    + '<button class="minibtn" id="btnResetStrings" style="margin-top:6px">'
    + esc(T.resetText) + '</button></div>';
}

$('paneSite').addEventListener('input', e => {
  const el = e.target;
  if(el.id === 'strFilter'){
    strFilter = el.value;
    const pos = el.selectionStart;
    renderSite();
    const again = $('strFilter');
    if(again){ again.focus(); again.setSelectionRange(pos, pos); }
    return;
  }
  if(el.dataset.set){
    const k = el.dataset.set;
    settings[k] = k === 'minDist' ? (parseInt(el.value, 10) || 0)
                : k === 'code' ? el.value.trim() : el.value;
    if(k === 'brand' || k === 'sub'){
      $('brandName').textContent = settings.brand || T.brand;
      $('brandSub').textContent = settings.sub;
    }
    saveSite();
    return;
  }
  if(el.dataset.str){
    const k = el.dataset.str;
    overrides[lang] = overrides[lang] || {};
    if(el.value === L10N[lang][k]) delete overrides[lang][k];
    else overrides[lang][k] = el.value;
    T = Object.assign({}, L10N[lang], overrides[lang] || {});
    el.closest('.strrow').classList.toggle('dirty', overrides[lang][k] !== undefined);
    saveSite();
  }
});

function renderReasons(){

  $('btnSendReport').disabled = false;

$('dGallery').addEventListener('click', e => {
  const img = e.target.closest('img');
  if(!img || !gallery.length) return;
  lbIndex = +img.dataset.i || 0;
  showLightbox();
});
function showLightbox(){
  $('lbImg').src = gallery[lbIndex];
  $('lbCount').textContent = (lbIndex + 1) + ' / ' + gallery.length;
  const solo = gallery.length < 2;
  $('lbPrev').classList.toggle('off', solo);
  $('lbNext').classList.toggle('off', solo);
  $('lightbox').classList.add('on');
  if(!solo){                                   // warm up the neighbours
    [1, -1].forEach(d => {
      const i = (lbIndex + d + gallery.length) % gallery.length;
      new Image().src = gallery[i];
    });
  }
}
function step(d){
  if(gallery.length < 2) return;
  lbIndex = (lbIndex + d + gallery.length) % gallery.length;
  showLightbox();
}
$('lbPrev').addEventListener('click', e => { e.stopPropagation(); step(-1); });
$('lbNext').addEventListener('click', e => { e.stopPropagation(); step(1); });

$('lightbox').addEventListener('click', e => {
  if(e.target.id === 'lbImg'){ step(1); return; }
  if(e.target.closest('.lb-nav')) return;
  $('lightbox').classList.remove('on');
});

let swipeX = null;
$('lbImg').addEventListener('touchstart', e => { swipeX = e.touches[0].clientX; }, {passive:true});
$('lbImg').addEventListener('touchend', e => {
  if(swipeX === null) return;
  const dx = e.changedTouches[0].clientX - swipeX;
  swipeX = null;
  if(Math.abs(dx) > 45) step(dx < 0 ? 1 : -1);
}, {passive:true});

document.addEventListener('keydown', e => {
  if(!$('lightbox').classList.contains('on')) return;
  if(e.key === 'Escape') $('lightbox').classList.remove('on');
  if(e.key === 'ArrowLeft')  step(-1);
  if(e.key === 'ArrowRight') step(1);
});

$('btnSendReport').addEventListener('click', async () => {
  const r = {
    id:'r' + Date.now(), placeId:reportCtx.placeId, by:deviceId,
    reason:reportCtx.reason, status:'open', at:Date.now(),
    thread:[{ from:'user', text:$('rMsg').value.trim() || T[reportCtx.reason], at:Date.now() }]
  };
  reports.push(r);
  rstore.cache = reports;
  await rstore.save();
  renderAdmin();

function openThread(reportId, asAdmin){
  const r = reports.find(x => x.id === reportId);
  if(!r) return;
  reportCtx = { placeId:r.placeId, reportId, asAdmin, reason:r.reason };
  $('reportNew').style.display = 'none';
  $('reportThread').style.display = '';
  renderThread();
  openPanel('report');
}

function renderThread(){
  const r = reports.find(x => x.id === reportCtx.reportId);
  if(!r) return;
  const raw = places.find(x => x.id === r.placeId);
  $('reportHead').textContent = raw ? view(raw).name : T.reportTitle;
  $('rThreadTag').textContent = (T[r.reason] || '') + ' · '
    + (r.status === 'open' ? T.statusOpen : T.statusResolved);
  $('rThread').innerHTML = r.thread.map(m =>
    '<div class="bub ' + m.from + '">' + esc(m.text)
    + '<time>' + (m.from === 'admin' ? esc(T.adminTag) : esc(T.youTag)) + ' · '
    + new Date(m.at).toLocaleDateString() + '</time></div>').join('')
    + (reportCtx.asAdmin && r.status === 'open'
        ? '<button class="no" style="margin-top:8px;padding:11px;border-radius:12px;font-size:12.5px;font-weight:700" id="btnResolve">'
          + esc(T.resolve) + '</button>' : '');
  $('rReply').disabled = r.status !== 'open';
  const rb = $('btnResolve');
  if(rb) rb.addEventListener('click', async () => {
    r.status = 'resolved';
    rstore.cache = reports;
    await rstore.save();
    renderThread(); renderAdmin();
  });
}

$('rReply').addEventListener('input', e => { $('btnReply').disabled = !e.target.value.trim(); });
$('rReply').addEventListener('keydown', e => { if(e.key === 'Enter') $('btnReply').click(); });
$('btnReply').addEventListener('click', async () => {
  const txt = $('rReply').value.trim();
  if(!txt) return;
  const r = reports.find(x => x.id === reportCtx.reportId);
  r.thread.push({ from: reportCtx.asAdmin ? 'admin' : 'user', text:txt, at:Date.now() });
  if(reportCtx.asAdmin) r.status = 'open';
  rstore.cache = reports;
  await rstore.save();
  $('rReply').value = '';
  $('btnReply').disabled = true;
  renderThread(); renderAdmin();
});

/* ---------- boot ---------- */
(async () => {
  await initDevice();
  try{ const v = await db.get('masalek:settings'); if(v) Object.assign(settings, JSON.parse(v)); }catch(e){}
  try{ const v = await db.get('masalek:i18n'); if(v) overrides = JSON.parse(v) || {}; }catch(e){}
  map.setView([settings.lat, settings.lng], settings.zoom);
  setBasemap(settings.basemap || 'green');
  places = mergeFR(await store.load());
  store.cache = places;
  store.save();
  reports = await rstore.load();
  let saved = await db.get('masalek:lang');
  if(!saved){
    const n = (navigator.language || 'ar').slice(0,2);
    saved = L10N[n] ? n : 'ar';
  }
  applyLang(saved);
  updateBadges();
  const checkHash = () => {
    if(location.hash.toLowerCase() === '#admin'){
      if(isAdmin){ renderAdmin(); openPanel('admin'); }
      else openPanel('gate');
    }
  };
  window.addEventListener('hashchange', checkHash);
  checkHash();
  hydratePhotos();
  scheduleDiscover();
  setTimeout(() => setSheet(true), 500);
  if(navigator.permissions){
    try{
      const st = await navigator.permissions.query({ name:'geolocation' });
      if(st.state === 'granted') locate();
    }catch(e){}
  }
})();
